# dsh-kit bundle patch: register the kit plugin row, and route the web seam's
# search capability to the free-search provider merged from dsh-free-search
# (src/web-search.js). The base layer pins `searchProvider: deepseek-official`
# (a paid DeepSeek model call per search); this patch replaces that row's
# config — `searchProvider` is its only base key — with our free engine chain.
# A later profile patch can pin any provider back.
- id: web
  config:
    searchProvider: free-search

- insert:
    - id: dsh-kit
      name: dsh-kit
    - id: dsh-kit-dock
      name: dsh-kit-dock
    - id: dsh-kit-monitor
      name: dsh-kit-monitor
# 组件行统一由本 bundle 声明——插件页 dsh-kit 详情页列出全部组件（组件显示名
# 取各自包的 locale/*.json meta），组件配置页经 plugins.row.config 挂在组件行上
